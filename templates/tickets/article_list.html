{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-journal-text"></i> Bilgilendirme</h2>
<div class="row g-4">
    {% for article in articles %}
    <div class="col-md-4">
        <a href="{% url 'tickets:article_detail' article.slug %}" class="text-decoration-none">
            <div class="card h-100">
                {% if article.cover_image %}
                    <img src="{{ article.cover_image.url }}" class="card-img-top" style="height:180px; object-fit:cover;" alt="">
                {% endif %}
                <div class="card-body">
                    <h6 class="text-dark">{{ article.title }}</h6>
                    <p class="text-muted small mb-0">{{ article.summary }}</p>
                </div>
            </div>
        </a>
    </div>
    {% empty %}
    <p class="text-muted">Henüz makale yayınlanmadı.</p>
    {% endfor %}
</div>
{% endblock %}
