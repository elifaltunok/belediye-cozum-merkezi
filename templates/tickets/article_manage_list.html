{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-journal-text"></i> Makalelerim</h2>
    <a href="{% url 'tickets:article_create' %}" class="btn btn-primary btn-sm">Yeni Makale</a>
</div>
{% for article in articles %}
    <div class="card mb-2"><div class="card-body">
        <a href="{% url 'tickets:article_detail' article.slug %}">{{ article.title }}</a>
        <span class="badge {% if article.is_published %}bg-success{% else %}bg-secondary{% endif %}">
            {% if article.is_published %}Yayında{% else %}Taslak{% endif %}
        </span>
    </div></div>
{% empty %}
    <p class="text-muted">Henüz makale yazmadınız.</p>
{% endfor %}
{% endblock %}
